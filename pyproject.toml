[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lighteater"
version = "0.1.0"
description = "Modular, code-first engine for turning video and sound into flowing particle visuals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=2.0",
    # <5 is a real pin, not caution: cv2 5 rasterises Hershey text differently,
    # which moves every pixel of the drawn control panel (measured up to 5.2
    # mean-abs-diff over the panel ROI) and fails tests/test_goldens.py on a
    # fresh install. The panel is drawn entirely with cv2 primitives, so this
    # is a UI-affecting dependency, not just a decoder.
    "opencv-python>=4.10,<5",
    "moderngl>=5.12",
    "Pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",  # camera selection by name
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
# person matte (selfie segmentation); not needed for the default.
# opencv-contrib-python is pinned here, not in `dependencies`, because it only
# enters the environment through mediapipe — and it is NOT a spare wheel: it
# ships the SAME `cv2` module as opencv-python, installs after it, and therefore
# WINS the import. mediapipe requires it unbounded, so without this pin
# `pip install -e ".[person]"` lands opencv-contrib-python 5 next to the pinned
# opencv-python 4 and `cv2.__version__` comes back '5.0.0' — the pin above is
# satisfied on paper and defeated in the environment. Keep both bounds in step.
person = ["mediapipe>=0.10", "opencv-contrib-python>=4.10,<5"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["dtouch", "dtouch.modes"]

[tool.setuptools.package-data]
dtouch = ["assets/*.npy", "shaders/physarum/*", "shaders/dither/*", "shaders/rack/*"]
